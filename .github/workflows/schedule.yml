name: Private Poster

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache Xray binary
        id: cache-xray
        uses: actions/cache@v3
        with:
          path: ./bin
          key: xray-linux-64-v25.12.8

      - name: Download Xray (if not cached)
        if: steps.cache-xray.outputs.cache-hit != 'true'
        run: |
          mkdir -p ./bin
          curl -L https://github.com/XTLS/Xray-core/releases/download/v25.12.8/Xray-linux-64.zip -o ./bin/xray.zip
          unzip -o ./bin/xray.zip -d ./bin/ xray
          chmod +x ./bin/xray
        shell: bash

      - name: Set XRAY_PATH
        run: echo "XRAY_PATH=$(pwd)/bin/xray" >> $GITHUB_ENV

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

      - name: Run private poster
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_PRIVATE_CHANNEL: ${{ secrets.TELEGRAM_PRIVATE_CHANNEL }}
          GH_TOKEN: ${{ secrets.VPNPRIVATEPOSTER }}
          TELEGRAM_DRY_RUN: "0"
          XRAY_BIN: ${{ env.XRAY_PATH }}
          # AI для улучшения технического поста (ТЗ3 п.4). Нет ключа → fallback.
          AI_API_KEY: ${{ secrets.API_KEY }}
          AI_BASE_URL: https://api.groq.com/openai/v1
          MODEL_PRIMARY: openai/gpt-oss-120b
          MODEL_FALLBACK: openai/gpt-oss-20b
          # Технический пост (subscription_update) публикуется автоматически.
          # Контентные посты (content_draft) — нет (отдельный workflow).
          ADMIN_REVIEW_REQUIRED: "1"
          AUTO_PUBLISH: "0"
        run: python poster_private.py

      - name: Commit published log and reports
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          # Постер меняет: checked/* (файлы подписок), data/current+previous_report.json,
          # data/diagnostics.jsonl, data/published.jsonl. Стейджим всё разом,
          # иначе pull --rebase падает на unstaged changes.
          git add data/ checked/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Новых записей нет — коммит не нужен"
          else
            git commit -m "Update published data — $(date -u +'%Y-%m-%d %H:%M UTC')"
            # push_to_repo уже запушил checked/ — наш коммит поверх него (rebase)
            git pull --rebase origin main
            git push origin main
          fi
        env:
          GH_TOKEN: ${{ secrets.VPNPRIVATEPOSTER }}
