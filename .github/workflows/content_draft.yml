name: Content Draft

on:
  schedule:
    # Утро / день / вечер (по ТЗ1: не всё сразу)
    - cron: '30 5,12,17 * * *'
  workflow_dispatch:

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate content draft
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: https://api.groq.com/openai/v1
          MODEL_PRIMARY: openai/gpt-oss-120b
          MODEL_FALLBACK: openai/gpt-oss-20b
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_PRIVATE_CHANNEL: ${{ secrets.TELEGRAM_PRIVATE_CHANNEL }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        run: python -m src.content_generator

      - name: Commit drafts (if any)
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add data/drafts/*.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Add content drafts — $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push origin main
          else
            echo "Новых черновиков нет — коммит не нужен"
          fi
        env:
          GH_TOKEN: ${{ secrets.VPNPRIVATEPOSTER }}
