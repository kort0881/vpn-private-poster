name: Content Approval

on:
  schedule:
    # Каждые 2 минуты — обрабатывает нажатия кнопок админа
    - cron: '*/2 * * * *'
  workflow_dispatch:

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Process approval buttons
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_PRIVATE_CHANNEL: ${{ secrets.TELEGRAM_PRIVATE_CHANNEL }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        run: python -m src.approval_bot --once

      - name: Commit decisions
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add data/published.jsonl data/drafts/ 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Process content approvals — $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push origin main
          else
            echo "Решений по кнопкам нет — коммит не нужен"
          fi
        env:
          GH_TOKEN: ${{ secrets.VPNPRIVATEPOSTER }}
