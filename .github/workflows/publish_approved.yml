name: Publish Approved Content

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Publish approved drafts (mode C)
        env:
          AI_API_KEY: ${{ secrets.API_KEY }}
          AI_BASE_URL: https://api.groq.com/openai/v1
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_PRIVATE_CHANNEL: ${{ secrets.TELEGRAM_PRIVATE_CHANNEL }}
        run: python -m src.content_generator --publish-approved

      - name: Commit published log and drafts (if any)
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add data/published.jsonl data/drafts/*.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Publish approved content — $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push origin main
          else
            echo "Одобренных неопубликованных черновиков нет — коммит не нужен"
          fi
        env:
          GH_TOKEN: ${{ secrets.VPNPRIVATEPOSTER }}
