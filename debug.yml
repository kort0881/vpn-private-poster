name: Debug Xray

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download Xray
        run: |
          mkdir -p ./bin
          curl -L https://github.com/XTLS/Xray-core/releases/download/v25.12.8/Xray-linux-64.zip -o ./bin/xray.zip
          unzip -o ./bin/xray.zip -d ./bin/ xray
          chmod +x ./bin/xray
        shell: bash

      - name: Set XRAY_BIN
        run: echo "XRAY_BIN=$(pwd)/bin/xray" >> $GITHUB_ENV

      - name: Run debug
        run: python debug_xray.py
