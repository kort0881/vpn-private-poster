# ==================================================
# Параметры проекта vpn-private-poster
# Переопределяются переменными окружения (см. README).
# ==================================================

# Сколько ключей максимум проверять за запуск
max_keys_to_check: 1000

# Параллельных потоков проверки
max_workers: 20

# Таймаут TCP-соединения, секунды
tcp_timeout: 3

# Таймаут Xray-проверки (контрольный запрос), секунды
xray_timeout: 8

# Минимальное количество рабочих конфигураций для публикации
min_publish_count: 3

# Публиковать ли пустой/слишком маленький результат
publish_on_empty_result: false

# Сохранять предыдущий набор checked/ при неудаче
keep_previous_on_failure: true

# Заменять hostname в конфигурациях (опасно, по умолчанию выключено)
replace_hosts: false

# Требовать проверки администратора перед публикацией AI-постов
admin_review_required: true

# Публиковать AI-посты автоматически
auto_publish: false

# Максимальный возраст источника контента, дней
max_source_age_days: 7
